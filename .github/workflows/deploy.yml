name: Deploy to VPS

on:
  push:
    branches:
      - main
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # VPS_SSH_KEY holds the private key base64-encoded (base64 -w0 <keyfile>).
      # A raw multi-line PEM pasted into a GitHub secret is an easy way to
      # silently corrupt the key (dropped/merged lines, stray whitespace) and
      # produces "ssh: no key found" with no indication of what's wrong.
      # Base64 collapses it to one line that paste can't mangle; decode it
      # once here into a step output, reused by every SSH step below.
      - name: Decode SSH deploy key
        id: ssh_key
        shell: bash
        run: |
          DECODED="$(printf '%s' "${{ secrets.VPS_SSH_KEY }}" | base64 -d 2>/dev/null || true)"
          if [ -z "$DECODED" ] || ! printf '%s' "$DECODED" | grep -q "PRIVATE KEY"; then
            echo "::error::VPS_SSH_KEY did not decode to a valid private key. Set it to the output of: base64 -w0 ~/.ssh/github_deploy_key (run on the VPS)."
            exit 1
          fi
          echo "::add-mask::$DECODED"
          {
            echo "key<<SSHKEY_EOF"
            echo "$DECODED"
            echo "SSHKEY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Write Node .env to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ steps.ssh_key.outputs.key }}
          port: ${{ secrets.VPS_PORT }}
          envs: NODE_ENV_FILE
          script: |
            mkdir -p /home/ubuntu/medresearch-ai/backend-node
            cat > /home/ubuntu/medresearch-ai/backend-node/.env << 'ENVEOF'
            ${{ secrets.NODE_ENV_FILE }}
            ENVEOF
        env:
          NODE_ENV_FILE: ${{ secrets.NODE_ENV_FILE }}

      - name: Write Python .env to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ steps.ssh_key.outputs.key }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            mkdir -p /home/ubuntu/medresearch-ai/backend-python
            cat > /home/ubuntu/medresearch-ai/backend-python/.env << 'ENVEOF'
            ${{ secrets.PYTHON_ENV_FILE }}
            ENVEOF

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ steps.ssh_key.outputs.key }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            PROJECT_DIR="/home/ubuntu/medresearch-ai"

            # 1. Clone repository if not already a git checkout.
            # Check for .git specifically, not just the directory — the
            # ".env"-writing steps above `mkdir -p` backend-node/backend-python
            # inside PROJECT_DIR before this step ever runs, so the directory
            # already exists on first deploy without being a git repo, and a
            # plain `git clone` into it would fail (non-empty destination).
            # `git init` + remote in place preserves those untracked .env files.
            if [ ! -d "$PROJECT_DIR/.git" ]; then
              echo "No git repo at $PROJECT_DIR yet — initializing..."
              mkdir -p "$PROJECT_DIR"
              cd "$PROJECT_DIR"
              git init
              git remote add origin https://github.com/SohailShabbir867/ResearchFlow_AI.git
            fi

            cd "$PROJECT_DIR"
            echo "Pulling latest changes on branch ${{ github.ref_name }}..."
            git fetch --all
            git checkout ${{ github.ref_name }} || git checkout -b ${{ github.ref_name }} origin/${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            # 2. Update Node.js backend
            if [ -d "backend-node" ]; then
              echo "Updating Node backend..."
              cd backend-node
              # Force the Node backend onto 5050. food-garden-server already
              # owns port 5000, and the NODE_ENV_FILE secret still pins
              # PORT=5000, so any deploy would otherwise crash with EADDRINUSE.
              grep -q '^PORT=' .env && sed -i 's/^PORT=.*/PORT=5050/' .env || echo 'PORT=5050' >> .env
              npm install --omit=dev
              pm2 delete medresearch-node 2>/dev/null || true
              pm2 start src/server.js --name "medresearch-node"
              cd ..
            fi

            # 3. Update Python backend (Python 3.11 via uv)
            if [ -d "backend-python" ]; then
              echo "Updating Python backend..."
              cd backend-python
              if [ ! -d ".venv" ]; then
                ~/.local/bin/uv venv .venv --python 3.11
              fi
              ~/.local/bin/uv pip install -r requirements.txt --python .venv
              # Ensure documents folder exists for the watcher
              mkdir -p data/documents
              pm2 delete medresearch-python 2>/dev/null || true
              pm2 start ".venv/bin/uvicorn src.api:app --host 0.0.0.0 --port 8000" --name "medresearch-python"
              # Auto-embedding watcher — watches data/documents/ for new files
              pm2 delete medresearch-watcher 2>/dev/null || true
              pm2 start "src/watcher.py" \
                --name "medresearch-watcher" \
                --interpreter ".venv/bin/python" \
                --log-date-format "YYYY-MM-DD HH:mm:ss"
              cd ..
            fi

            # 4. Build Frontend and publish it where nginx actually serves it
            # from. nginx's `medresearch` site root is /var/www/medresearch-frontend
            # (see /etc/nginx/sites-available/medresearch), which is a different
            # path from frontend/dist inside the repo checkout - without this
            # sync step, `npm run build` produces a fresh build that nginx never
            # sees, and the live site keeps serving whatever was last manually
            # placed there.
            if [ -d "frontend" ]; then
              echo "Building Frontend..."
              cd frontend
              npm install
              npm run build
              echo "Publishing frontend build to nginx web root..."
              rsync -a --delete dist/ /var/www/medresearch-frontend/
              cd ..
            fi

            # 5. Persist the PM2 process list so it survives a VPS reboot.
            # (Requires `pm2 startup` to have been run once manually on the
            # server beforehand — see README/deployment docs.)
            pm2 save

            # 6. Post-deploy health check — fail the workflow loudly instead of
            # reporting success while a service is actually down.
            echo "Waiting for services to come up..."
            sleep 5
            NODE_OK=false
            PYTHON_OK=false
            for i in 1 2 3 4 5 6; do
              # script_stop: true runs this whole script under `set -e`, so a
              # bare failing curl here would abort the script instantly on the
              # first unready attempt instead of letting the loop retry.
              # `|| true` keeps each check's exit status 0 no matter the result.
              curl -sf http://localhost:5050/health > /dev/null 2>&1 && NODE_OK=true || true
              curl -sf http://localhost:8000/health > /dev/null 2>&1 && PYTHON_OK=true || true
              if [ "$NODE_OK" = true ] && [ "$PYTHON_OK" = true ]; then
                break
              fi
              sleep 5
            done

            if [ "$NODE_OK" != true ]; then
              echo "::error::Node backend health check failed after deploy — pm2 logs medresearch-node"
              pm2 logs medresearch-node --lines 30 --nostream || true
              exit 1
            fi
            if [ "$PYTHON_OK" != true ]; then
              echo "::error::Python RAG backend health check failed after deploy — pm2 logs medresearch-python"
              pm2 logs medresearch-python --lines 30 --nostream || true
              exit 1
            fi

            echo "🚀 Deployment successfully completed and health checks passed!"
