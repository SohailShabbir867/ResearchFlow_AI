version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant
    container_name: medresearch_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  mongodb:
    image: mongo:7
    container_name: medresearch_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=medresearch

volumes:
  qdrant_data:
  mongo_data:
